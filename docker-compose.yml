services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
      - media_data:/app/media
    environment:
      - DEBUG=True
      - DB_DIR=/app/data
      - SECRET_KEY=django-insecure-local-dev-key-change-in-production
      - ALLOWED_HOSTS=localhost 127.0.0.1

volumes:
  db_data:
  media_data:
