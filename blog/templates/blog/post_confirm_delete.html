{% extends "blog/base.html" %}

{% block title %}Delete Post{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Delete Post</h2>
    <p style="margin-bottom:1.5rem;">Are you sure you want to delete <strong>"{{ post.title }}"</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{{ post.get_absolute_url }}" class="btn btn-secondary" style="margin-left:0.5rem;">Cancel</a>
    </form>
</div>
{% endblock %}
